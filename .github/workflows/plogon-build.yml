name: Plogon build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read  # no packages: the build must not need GitHub Packages

jobs:

  # Builds the plugin offline the way D17 does, from nuget.org packages only
  plogon-build:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/plogon-build.yml@98738d9d6f9294110f8ff7317f2300e3b1a52e72 # v0.9.0
    with:
      project-dir: SayMyName
