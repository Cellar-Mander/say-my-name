name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The release workflow dispatches this for its repo.json PR, which can't trigger it otherwise
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # Buildingway.Build and Buildingway.Tools from GitHub Packages

jobs:

  # Only the game-independent projects; the plugin itself needs a Dalamud install to build.
  # Its revert-check job informs only: keep it out of required checks.
  test:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/test.yml@2dc2514507e9a7a69c2cdd457483ce346095a244 # v0.7.0
    with:
      test-project: SayMyName.Core.Tests
