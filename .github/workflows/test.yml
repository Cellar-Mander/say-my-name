name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The release workflow dispatches this for its repo.json PR, which can't trigger it otherwise
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # Buildingway.Tools from GitHub Packages

jobs:

  # Only the game-independent projects; the plugin itself needs a Dalamud install to build.
  # Its revert-check job informs only: keep it out of required checks.
  test:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/test.yml@97125d26e87f2bc8c3f38fe0df150ab58e24e4fc # claude/revert-check-tool; re-pin to its tag once merged
    with:
      test-project: SayMyName.Core.Tests
