name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Only the game-independent projects; the plugin itself needs a Dalamud install to build
    - name: Test
      run: dotnet test SayMyName.Core.Tests --configuration Release
