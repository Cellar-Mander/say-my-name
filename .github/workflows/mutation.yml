name: Mutation

# Would the Core tests catch plausible faults? Stryker.NET mutates SayMyName.Core and reruns them.
# Informs only: no score threshold, and keep this workflow out of required checks.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # PRs only test mutants in code or tests changed against the base branch. The "mutation" label asks
  # for a full run instead, e.g. when tests were deleted.
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    paths:
      - 'SayMyName.Core/**'
      - 'SayMyName.Core.Tests/**'
      - '.github/workflows/mutation.yml'

jobs:

  mutation:
    # Other labels shouldn't start a run
    if: github.event.action != 'labeled' || github.event.label.name == 'mutation'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # --since diffs against the base branch
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore tools
      run: dotnet tool restore

    # Settings live in SayMyName.Core.Tests/stryker-config.json
    - name: Mutation test
      working-directory: SayMyName.Core.Tests
      env:
        SINCE: >-
          ${{ github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'mutation')
          && format('--since:origin/{0}', github.base_ref) || '' }}
      run: dotnet stryker $SINCE --output "$RUNNER_TEMP/stryker"

    - name: Summary
      if: always()
      run: cat "$RUNNER_TEMP/stryker/reports/mutation-report.md" >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mutation-report
        path: ${{ runner.temp }}/stryker/reports/
        if-no-files-found: ignore
