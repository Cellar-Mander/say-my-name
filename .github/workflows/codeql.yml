name: CodeQL

# Static analysis for untrusted-input defects, chat above all. On trial: informs only, and keep it
# out of required checks until a run shows it is worth keeping.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # No build: the plugin needs a Dalamud install, which Linux runners lack
        language: [ csharp, actions ]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialise CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended

    - name: Analyse
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:${{ matrix.language }}
