name: Changelog

# A PR that changes the plugin's code should say what changed for users in CHANGELOG.md.
# Informs only: keep this job out of required checks. Label a PR no-changelog when the change
# isn't user-facing; Dependabot's PRs are skipped, as package bumps don't change behaviour users see.
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

permissions:
  contents: read

jobs:

  changelog:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/changelog.yml@7d04c78032f34b740c93a6c0dbdf089c83e26da3 # v0.8.0
    with:
      # The trailing slashes keep SayMyName.Core.Tests out
      paths: SayMyName/ SayMyName.Core/
