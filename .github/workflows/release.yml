name: Release

# See "Releasing" in CONTRIBUTING.md for the whole process.
# Merging a change to <Version> into main (scripts/release prepare opens that PR) asks to tag the
# merge commit v<Version>; approve the "release" deployment in the run to tag and publish it.
# Pushing a tag named after the plugin's <Version>, e.g. v0.1.0.0, publishes that commit directly.
# The "release" environment must require your review (Settings > Environments): a missing one is
# created without protection, and the tag would be made unasked.
# Main only takes PRs, so a release pushes repo.json to the release/repo-json branch and opens a PR
# (or updates the open one); installs see the release once you merge it. This needs "Allow GitHub
# Actions to create and approve pull requests" on in Settings > Actions > General.
# A test tag, e.g. v0.1.0.0-test1, makes a prerelease and pushes repo.json to the release-test
# branch instead of main; delete both afterwards:
#   gh release delete v0.1.0.0-test1 --cleanup-tag --yes && git push origin --delete release-test
on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
    paths: [ SayMyName/SayMyName.csproj ]

# One release at a time, so two tags can't race to update repo.json
concurrency: release

jobs:

  # A push to main that changed <Version> names the tag to make; other csproj changes name none
  version:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Compare versions
      id: version
      run: |
        version() { git show "$1:SayMyName/SayMyName.csproj" | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p'; }
        new=$(version HEAD)
        if [[ $new == "$(version HEAD^)" ]]; then
          echo "<Version> unchanged at $new; nothing to release."
        elif git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null; then
          echo "::warning::Tag v$new already exists; not tagging again."
        else
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
        fi

  # Waits for your approval of the "release" deployment. A tag pushed with github.token starts no
  # workflow, so this run goes on to build and publish it.
  tag:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Tag
      run: |
        git tag "$TAG" "$GITHUB_SHA"
        git push origin "refs/tags/$TAG"

  # The plugin builds against a Dalamud install, so this runs on Windows where the SDK finds it
  build:
    needs: [ version, tag ]
    # Runs for a pushed tag, where version and tag are skipped, or once tag has made one
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.tag.result == 'success') }}
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install Dalamud
      uses: ./.github/actions/install-dalamud

    # The notes are the tag's CHANGELOG section for the version, so they say what users read in
    # the changelog. A test tag made before the section was dated falls back to Unreleased.
    # changelog.txt is the same section as plain text for the manifest's Changelog, which the
    # plugin installer shows under Changelogs without rendering markdown.
    - name: Changelog
      shell: bash
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}
      run: |
        section() {
          awk -v h="$1" '/^## /{s = index($0 " ", h " ") == 1; next} s' CHANGELOG.md | sed '/./,$!d'
        }
        base=${TAG%%-test*}
        section "## ${base#v}" > notes.md
        if [[ ! -s notes.md && $base != "$TAG" ]]; then
          section "## Unreleased" > notes.md
          [[ -s notes.md ]] || echo "Test build of $TAG." > notes.md
        fi
        if [[ ! -s notes.md ]]; then
          echo "::error file=CHANGELOG.md::No CHANGELOG section for ${base#v} at $TAG"
          exit 1
        fi
        sed -E 's/^#+ +(.*)/\1:/; s/^( *)[-*] /\1• /; s/\[([^]]*)\]\(([^)]*)\)/\1 (\2)/g; s/\*\*|__|`//g' notes.md > changelog.txt

    - name: Build
      run: dotnet build -c Release -p:ChangelogFile="$PWD\changelog.txt"

    # DalamudPackager writes the zip and the manifest the repo.json entry is made from
    - name: Upload plugin
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: |
          SayMyName/bin/x64/Release/SayMyName/latest.zip
          SayMyName/bin/x64/Release/SayMyName/SayMyName.json
        if-no-files-found: error
        retention-days: 1

    # Separate, as one artifact's files are stored relative to their common folder
    - name: Upload notes
      uses: actions/upload-artifact@v7
      with:
        name: notes
        path: notes.md
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: [ version, build ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}

    steps:
    - name: Checkout main
      uses: actions/checkout@v7
      with:
        ref: main

    - name: Download plugin
      uses: actions/download-artifact@v7
      with:
        name: release
        path: release

    - name: Download notes
      uses: actions/download-artifact@v7
      with:
        name: notes
        path: release

    # A tag that doesn't match <Version> would publish a zip whose version Dalamud reads differently
    - name: Check version
      run: |
        version=$(jq -r .AssemblyVersion release/SayMyName.json)
        base=${TAG%%-test*}
        if [[ "v$version" != "$base" ]]; then
          echo "::error::Tag $TAG doesn't match the plugin version $version; set <Version> in SayMyName.csproj or retag"
          exit 1
        fi
        if [[ "$base" != "$TAG" ]]; then
          echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          echo "BRANCH=release-test" >> "$GITHUB_ENV"
        else
          echo "BRANCH=main" >> "$GITHUB_ENV"
        fi

    # The notes are the CHANGELOG section the build job put in the manifest
    - name: Create release
      run: |
        mv release/latest.zip release/SayMyName.zip
        gh release create "$TAG" release/SayMyName.zip --verify-tag --notes-file release/notes.md --title "$TAG" $PRERELEASE

    # repo.json (pluginmaster format) is what /xlsettings fetches from the raw main URL
    - name: Update repo.json
      run: |
        url="https://github.com/${{ github.repository }}/releases/download/$TAG/SayMyName.zip"
        jq --arg url "$url" --argjson now "$(date +%s)" '[. + {
            DownloadLinkInstall: $url,
            DownloadLinkUpdate: $url,
            DownloadLinkTesting: $url,
            IsHide: false,
            IsTestingExclusive: false,
            LastUpdate: $now
          }]' release/SayMyName.json > repo.json
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add repo.json
        git commit -m "Update repo.json for $TAG"
        # Both branches are throwaway copies of main, so overwrite whatever an earlier run left;
        # an unmerged release PR then always holds the newest repo.json, with no conflict
        if [[ $BRANCH == main ]]; then
          git push --force origin HEAD:release/repo-json
          title="Update repo.json for $TAG"
          if [[ -n $(gh pr list --head release/repo-json --base main --state open --json number --jq '.[].number') ]]; then
            gh pr edit release/repo-json --title "$title"
          else
            gh pr create --head release/repo-json --base main --title "$title" \
              --body "Merge to publish $TAG to /xlsettings installs. Check the version and download links first."
          fi
          # Pushes and PRs made with github.token start no workflows, so main's required "test"
          # check would never report; a workflow_dispatch run is the exception, and its check on
          # the branch head counts for the PR
          gh workflow run test.yml --ref release/repo-json
        else
          git push --force origin "HEAD:$BRANCH"
        fi
