name: Release

# See "Releasing" in CONTRIBUTING.md for the whole process.
# Run this workflow on main (Actions > Release > Run workflow, or scripts/release publish) to
# publish main's <Version>. The stable channel tags v<Version>; the testing channel tags
# v<Version>-rc1, a prerelease offered only to installs that receive testing versions. Each
# testing build needs its own <Version>, since Dalamud only updates to a higher one.
# Pushing a tag by hand publishes that commit directly: v0.1.0.0 as stable, v0.1.0.0-rc1 as testing.
# Main only takes PRs, so a release pushes repo.json to the release/repo-json branch and opens a PR
# (or updates the open one); installs see the release once you merge it. This needs "Allow GitHub
# Actions to create and approve pull requests" on in Settings > Actions > General.
# A test tag, e.g. v0.1.0.0-test1, makes a prerelease and pushes repo.json to the release-test
# branch instead of main; delete both afterwards:
#   gh release delete v0.1.0.0-test1 --cleanup-tag --yes && git push origin --delete release-test
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish main's <Version> to
        type: choice
        options: [ testing, stable ]
        default: testing

# One release at a time, so two runs can't race to update repo.json
concurrency: release

# Each job names the permissions it needs
permissions: {}

jobs:

  # Names the tag for main's <Version> and pushes it. A tag pushed with github.token starts no
  # workflow, so this run goes on to build and publish it.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        # git push uses the token checkout stores; no job uploads the workspace
        persist-credentials: true

    - name: Tag
      id: tag
      run: |
        # Another branch's copy of this workflow could publish differently
        if [[ $GITHUB_REF != refs/heads/main ]]; then
          echo "::error::Run this workflow on main, not $GITHUB_REF_NAME"
          exit 1
        fi
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SayMyName/SayMyName.csproj)
        tags=$(git ls-remote --tags --refs origin "refs/tags/v$version*" | sed 's:.*refs/tags/::')
        if grep -qxF "v$version" <<<"$tags"; then
          echo "::error::v$version is already released; merge a <Version> bump (scripts/release prepare) first"
          exit 1
        fi
        if [[ $CHANNEL == stable ]]; then
          # Entries merged since <Version> was bumped would be left out of the release notes
          if awk '/^## /{u = ($0 == "## Unreleased"); next} u && NF {found=1} END {exit !found}' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Move the Unreleased entries under ## $version first"
            exit 1
          fi
          tag=v$version
        else
          # Overwriting an unmerged stable repo.json PR would drop that release from installs
          open=$(gh pr list --head release/repo-json --base main --state open --json title --jq '.[].title')
          if [[ -n $open && $open != *-rc* ]]; then
            echo "::error::Merge or close the PR \"$open\" first, or this testing build would replace it"
            exit 1
          fi
          # Dalamud offers an update only above the installed version, so a second testing build
          # at the same <Version> would never reach installs that have the first
          last=$(grep -E "^v${version//./\\.}-rc[0-9]+$" <<<"$tags" | sort -V | tail -1 || true)
          if [[ -n $last ]]; then
            echo "::error::$last is already out for testing, and installs that have it won't update to another build of $version; bump <Version> (scripts/release prepare ${version%.*}.$((${version##*.} + 1))) first"
            exit 1
          fi
          tag=v$version-rc1
        fi
        git tag "$tag" HEAD
        git push origin "refs/tags/$tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "Tagged $tag at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  # The plugin builds against a Dalamud install, so this runs on Windows where the SDK finds it
  build:
    needs: tag
    # Runs for a pushed tag, where tag is skipped, or once tag has made one
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.tag.result == 'success') }}
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.ref_type == 'tag' && github.ref_name || needs.tag.outputs.tag }}

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install Dalamud
      uses: ./.github/actions/install-dalamud

    # The notes are the tag's CHANGELOG section for the version, so they say what users read in
    # the changelog. A testing build also has the Unreleased entries merged since <Version> was
    # bumped, ahead of the section; a test tag made before the section was dated falls back to
    # Unreleased. changelog.txt is the same text as plain text for the manifest's Changelog, which
    # the plugin installer shows under Changelogs without rendering markdown.
    - name: Changelog
      shell: bash
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.tag.outputs.tag }}
      run: |
        section() {
          awk -v h="$1" '/^## /{s = index($0 " ", h " ") == 1; next} s' CHANGELOG.md | sed '/./,$!d'
        }
        base=${TAG%%-*}
        notes=$(section "## ${base#v}")
        if [[ $TAG == *-rc* ]]; then
          notes=$(printf '%s\n\n%s\n' "$(section "## Unreleased")" "$notes" | sed '/./,$!d')
        elif [[ -z $notes && $TAG == *-test* ]]; then
          notes=$(section "## Unreleased")
          notes=${notes:-Test build of $TAG.}
        fi
        if [[ -z $notes ]]; then
          echo "::error file=CHANGELOG.md::No CHANGELOG section for ${base#v} at $TAG"
          exit 1
        fi
        printf '%s\n' "$notes" > notes.md
        sed -E 's/^#+ +(.*)/\1:/; s/^( *)[-*] /\1• /; s/\[([^]]*)\]\(([^)]*)\)/\1 (\2)/g; s/\*\*|__|`//g' notes.md > changelog.txt

    - name: Build
      run: dotnet build -c Release -p:ChangelogFile="$PWD\changelog.txt"

    # DalamudPackager writes the zip and the manifest the repo.json entry is made from
    - name: Upload plugin
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release
        path: |
          SayMyName/bin/x64/Release/SayMyName/latest.zip
          SayMyName/bin/x64/Release/SayMyName/SayMyName.json
        if-no-files-found: error
        retention-days: 1

    # Separate, as one artifact's files are stored relative to their common folder
    - name: Upload notes
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: notes
        path: notes.md
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: [ tag, build ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.tag.outputs.tag }}

    steps:
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        # git push uses the token checkout stores; no job uploads the workspace
        persist-credentials: true

    - name: Download plugin
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release
        path: release

    - name: Download notes
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: notes
        path: release

    # A tag that doesn't match <Version> would publish a zip whose version Dalamud reads differently
    - name: Check version
      run: |
        version=$(jq -r .AssemblyVersion release/SayMyName.json)
        base=${TAG%%-*}
        if [[ "v$version" != "$base" ]]; then
          echo "::error::Tag $TAG doesn't match the plugin version $version; set <Version> in SayMyName.csproj or retag"
          exit 1
        fi
        if [[ $TAG == "$base" ]]; then
          echo "BRANCH=main" >> "$GITHUB_ENV"
        elif [[ $TAG =~ ^$base-rc[0-9]+$ ]]; then
          { echo "PRERELEASE=--prerelease"; echo "BRANCH=main"; echo "CHANNEL=testing"; } >> "$GITHUB_ENV"
        elif [[ $TAG =~ ^$base-test[0-9]+$ ]]; then
          { echo "PRERELEASE=--prerelease"; echo "BRANCH=release-test"; } >> "$GITHUB_ENV"
        else
          echo "::error::Tag $TAG is none of $base, $base-rc<n> or $base-test<n>"
          exit 1
        fi

    # The notes are the CHANGELOG section the build job put in the manifest
    - name: Create release
      run: |
        mv release/latest.zip release/SayMyName.zip
        gh release create "$TAG" release/SayMyName.zip --verify-tag --notes-file release/notes.md --title "$TAG" ${PRERELEASE:+"$PRERELEASE"}

    # repo.json (pluginmaster format) is what /xlsettings fetches from the raw main URL. Dalamud
    # offers the Testing* fields only to installs that receive testing versions, and only while
    # TestingAssemblyVersion is above AssemblyVersion and TestingDalamudApiLevel is the game's.
    # A testing build sets just those on main's entry; a stable release rebuilds the entry from
    # its manifest, which has none, so it also ends any testing build.
    - name: Update repo.json
      run: |
        url="https://github.com/${{ github.repository }}/releases/download/$TAG/SayMyName.zip"
        if [[ $CHANNEL == testing ]]; then
          jq --arg url "$url" --argjson now "$(date +%s)" --slurpfile m release/SayMyName.json '.[0] += {
              TestingAssemblyVersion: $m[0].AssemblyVersion,
              TestingDalamudApiLevel: $m[0].DalamudApiLevel,
              TestingChangelog: ($m[0].Changelog // ""),
              DownloadLinkTesting: $url,
              LastUpdate: $now
            }' repo.json > repo.json.new
          mv repo.json.new repo.json
          body="Merge to offer $TAG to /xlsettings installs that receive testing versions. Check TestingAssemblyVersion and DownloadLinkTesting first; the stable fields should be unchanged."
        else
          jq --arg url "$url" --argjson now "$(date +%s)" '[. + {
              DownloadLinkInstall: $url,
              DownloadLinkUpdate: $url,
              DownloadLinkTesting: $url,
              IsHide: false,
              IsTestingExclusive: false,
              LastUpdate: $now
            }]' release/SayMyName.json > repo.json
          body="Merge to publish $TAG to /xlsettings installs. Check the version and download links first."
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add repo.json
        git commit -m "Update repo.json for $TAG"
        # Both branches are throwaway copies of main, so overwrite whatever an earlier run left;
        # an unmerged release PR then always holds the newest repo.json, with no conflict
        if [[ $BRANCH == main ]]; then
          git push --force origin HEAD:release/repo-json
          title="Update repo.json for $TAG"
          if [[ -n $(gh pr list --head release/repo-json --base main --state open --json number --jq '.[].number') ]]; then
            gh pr edit release/repo-json --title "$title"
          else
            gh pr create --head release/repo-json --base main --title "$title" --body "$body"
          fi
          # Pushes and PRs made with github.token start no workflows, so main's required checks
          # would never report; a workflow_dispatch run is the exception, and its checks on the
          # branch head count for the PR
          gh workflow run test.yml --ref release/repo-json
          gh workflow run workflow-lint.yml --ref release/repo-json
          gh workflow run pr-build.yml --ref release/repo-json
        else
          git push --force origin "HEAD:$BRANCH"
        fi
