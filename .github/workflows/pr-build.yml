name: PR build

on:
  pull_request:
    branches: [ main ]
  # The release workflow dispatches this for its repo.json PR, which can't trigger it otherwise
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # Buildingway.Build from GitHub Packages

jobs:

  # Builds against the Dalamud pinned in .github/dalamud.env
  pr-build:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/pr-build.yml@7d04c78032f34b740c93a6c0dbdf089c83e26da3 # v0.8.0
    with:
      plugin: SayMyName
