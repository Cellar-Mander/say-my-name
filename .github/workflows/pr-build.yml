name: PR build

on:
  pull_request:
    branches: [ main ]
  # The release workflow dispatches this for its repo.json PR, which can't trigger it otherwise
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # Buildingway.Build from GitHub Packages

jobs:

  # Builds against the Dalamud pinned in .github/dalamud.env
  pr-build:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/pr-build.yml@2dc2514507e9a7a69c2cdd457483ce346095a244 # v0.7.0
    with:
      plugin: SayMyName
