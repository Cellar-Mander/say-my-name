name: PR build

on:
  pull_request:
    branches: [ main ]

# Jobs read the repository only; a job that needs more says so
permissions:
  contents: read

jobs:

  # The plugin builds against a Dalamud install, so this runs on Windows where the SDK finds it
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install Dalamud
      uses: ./.github/actions/install-dalamud

    - name: Check formatting
      run: dotnet format --verify-no-changes

    - name: Build
      run: dotnet build -c Release

    - name: Upload plugin
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SayMyName
        path: SayMyName/bin/x64/Release/SayMyName/*
        if-no-files-found: error
        retention-days: 1
