name: PR build

on:
  pull_request:
    branches: [ main ]
  # The release workflow dispatches this for its repo.json PR, which can't trigger it otherwise
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # Buildingway.Build from GitHub Packages

jobs:

  # Builds against the Dalamud pinned in .github/dalamud.env
  pr-build:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/pr-build.yml@f9368131721c090fc548fb3f9200a0bc0339a11d # v0.6.0
    with:
      plugin: SayMyName
