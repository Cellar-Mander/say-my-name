name: PR build

on:
  pull_request:
    branches: [ main ]

jobs:

  # The plugin builds against a Dalamud install, so this runs on Windows where the SDK finds it
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install Dalamud
      uses: ./.github/actions/install-dalamud

    - name: Check formatting
      run: dotnet format --verify-no-changes

    - name: Build
      run: dotnet build -c Release

    - name: Upload plugin
      uses: actions/upload-artifact@v7
      with:
        name: SayMyName
        path: SayMyName/bin/x64/Release/SayMyName/*
        if-no-files-found: error
        retention-days: 1
