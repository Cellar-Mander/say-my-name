name: PR build

on:
  pull_request:
    branches: [ main ]
  # The release workflow dispatches this for its repo.json PR, which can't trigger it otherwise
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Builds against the Dalamud pinned in .github/dalamud.env
  pr-build:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/pr-build.yml@78153991f6260a95d159c42f47bdc0f3717f8039 # v0.1.0
    with:
      plugin: SayMyName
