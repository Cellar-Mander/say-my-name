name: Feature request
description: Suggest a new feature or a change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or change.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the plugin does it relate to?
      multiple: true
      options:
        - Name alert
        - Custom alert
        - You alert
        - Emote alert
        - Target Speaks alert
        - Sounds
        - Highlight colours
        - Settings window
        - Something new
